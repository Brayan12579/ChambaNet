# PHP compatible para ChambaNet. El PHP de otros proyectos de XAMPP se conserva.
# Este alias apunta solo al ejecutable CGI, no al directorio de PHP.
ScriptAlias /__chambanet_php85 "C:/php/php-cgi.exe"

<Directory "C:/php">
    AllowOverride None
    Require all denied
    SetEnv PHPRC "C:/php"

    <Files "php-cgi.exe">
        Require local
    </Files>
</Directory>

<Directory "C:/xampp/htdocs/TrabajoGO/public">
    <FilesMatch "\.php$">
        SetHandler application/x-httpd-chambanet-php85
    </FilesMatch>

    Action application/x-httpd-chambanet-php85 /__chambanet_php85
</Directory>
